version: "1.0"
effective_date: "2026-01-01"
description: "屯門區成交清洗規則 v1"

rules:
  address_normalize:
    - strip_whitespace
    - unify_floor_format        # "3/F", "3樓" → "3/F"

  dedup:
    key:
      - estate_name
      - block
      - floor
      - unit
      - transaction_date
      - price

  price:
    currency: HKD
    min: 100000
    max: 100000000

  area:
    unit: sqft
    min: 50
    max: 5000

  date:
    format: "%Y-%m-%d"
    max: today

  market_type:
    default: secondary
